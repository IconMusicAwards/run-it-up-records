<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIU Staff Portal</title><link rel="stylesheet" href="../css/admin.css?v=9"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><section id="login" class="login"><a class="logo-home" href="../" aria-label="Back to Run It Up Records website" title="Back to website"><img src="../assets/riu-logo.png"></a><small>RUN IT UP RECORDS</small><h1>STAFF PORTAL</h1><p>Where Ambition Becomes Legacy.</p><form id="loginForm"><label>ROLE<select id="role" required><option value="">Select clearance</option><option value="owner">OWNER</option><option value="executive">EXECUTIVE</option><option value="assistant_executive">ASSISTANT EXECUTIVE</option></select></label><label>PASSWORD<div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button id="togglePassword" type="button" class="eye-btn" aria-label="Show password" title="Show password"><span id="eyeIcon">◉</span></button></div></label><button id="loginBtn" type="submit">ACCESS DASHBOARD</button><p id="error"></p></form></section><section id="dashboard" class="dash hidden"><aside><a class="logo-home" href="../" aria-label="Back to Run It Up Records website" title="Back to website"><img src="../assets/riu-logo.png"></a><b>RIU CONTROL</b><span id="badge"></span><nav><button id="hubBtn" type="button">Dashboard Hub</button><button data-view="artist" data-permission="artists">Artists</button><button data-view="release" data-permission="music">Music</button><button data-view="event" data-permission="events">Events</button><button data-view="gallery" data-permission="gallery">Gallery</button><button data-view="team" data-permission="team">Team</button><button id="inboxBtn" data-permission="inbox" type="button">Contact Inbox</button><button id="financeBtn" data-permission="finance" type="button">Finances</button><button id="sheetBtn" data-permission="spreadsheet" type="button">Spreadsheet</button><button id="permissionsBtn" type="button">Permissions</button></nav><button id="logout">Log Out</button></aside><div class="workspace"><header><div><small>CONTENT MANAGEMENT</small><h1 id="viewTitle">ARTISTS</h1></div><button id="newItem">+ NEW ITEM</button></header><div id="hub" class="hub"></div><div id="items" class="items hidden"></div><div id="contactInbox" class="items hidden"></div><div id="financePanel" class="panel hidden"></div><div id="sheetPanel" class="panel hidden"></div><div id="permissionsPanel" class="panel hidden"></div></div></section></main><dialog id="editor"><form id="editorForm"><button type="button" id="close">×</button><h2 id="editorTitle">CONTENT EDITOR</h2><input id="itemId" type="hidden"><label id="titleLabel">TITLE<input id="title" required></label><div id="artistFields" class="hidden"><label>ARTIST GENRE<input id="genre" placeholder="Hip-Hop, R&B, Pop..."></label><label>ARTIST TYPE<select id="artistRole"><option value="Recording Artist">Recording Artist</option><option value="Producer">Producer</option><option value="Audio Engineer">Audio Engineer</option></select></label></div><div id="releaseFields" class="hidden"><label>ARTIST / CREATOR<input id="releaseArtist"></label><label>RELEASE TYPE<select id="releaseType"><option>Single</option><option>EP</option><option>Album</option><option>Mixtape</option></select></label><label>LISTEN LINK<input id="musicUrl" type="url" placeholder="Spotify, YouTube, SoundCloud..."></label></div><div id="eventFields" class="hidden"><label>EVENT TYPE<select id="eventType"><option>Concert</option><option>Release Party</option><option>Festival</option><option>Meet & Greet</option><option>Community Event</option><option>Private Event</option><option>Other</option></select></label><label>HOST / PRESENTED BY<input id="eventHost" placeholder="Run It Up Records"></label><label>VENUE<input id="venue" placeholder="Venue name"></label><label>EVENT ENDS<input id="eventEnd" type="datetime-local"></label><label>BUTTON TEXT<input id="eventCta" placeholder="I’M INTERESTED"></label></div><div id="galleryFields" class="hidden"><label>GALLERY CATEGORY<input id="galleryCategory" placeholder="Event, Studio, Behind the Scenes..."></label></div><div id="teamFields" class="hidden"><label>TEAM ROLE<input id="teamRole" placeholder="Owner, Executive, Management..."></label></div><label id="subtitleLabel">SUBTITLE<input id="subtitle"></label><label>UPLOAD IMAGE<input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small class="hint">PNG, JPG, WEBP or GIF. Max 10MB.</small></label><label>IMAGE URL<input id="imageUrl" type="url" placeholder="Or paste an image URL"></label><label id="bodyLabel">DETAILS<textarea id="body"></textarea></label><label>DATE<input id="eventDate" type="datetime-local"></label><label>LOCATION<input id="location"></label><label>STATUS<select id="status"><option value="draft">Draft</option><option value="published">Published</option></select></label><button id="saveBtn" type="submit">SAVE CHANGES</button></form></dialog><script src="../js/admin.js?v=16"></script><script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script><script src="https://unpkg.com/@wendellhu/redi@1.1.2/dist/umd/index.js"></script><script src="https://unpkg.com/@wendellhu/redi@1.1.2/dist/umd/react-bindings/index.js"></script><script src="../js/hub.js?v=7"></script><script src="../js/spreadsheet.js?v=8"></script></body></html>
