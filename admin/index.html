<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIU Staff Portal</title><link rel="stylesheet" href="../css/admin.css?v=3"></head><body><main><section id="login" class="login"><a class="logo-home" href="../" aria-label="Back to Run It Up Records website" title="Back to website"><img src="../assets/riu-logo.png"></a><small>RUN IT UP RECORDS</small><h1>STAFF PORTAL</h1><p>Where Ambition Becomes Legacy.</p><form id="loginForm"><label>ROLE<select id="role" required><option value="">Select clearance</option><option value="owner">OWNER</option><option value="executive">EXECUTIVE</option><option value="assistant_executive">ASSISTANT EXECUTIVE</option></select></label><label>PASSWORD<div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button id="togglePassword" type="button" class="eye-btn" aria-label="Show password" title="Show password"><span id="eyeIcon">◉</span></button></div></label><button id="loginBtn" type="submit">ACCESS DASHBOARD</button><p id="error"></p></form></section><section id="dashboard" class="dash hidden"><aside><a class="logo-home" href="../" aria-label="Back to Run It Up Records website" title="Back to website"><img src="../assets/riu-logo.png"></a><b>RIU CONTROL</b><span id="badge"></span><nav><button data-view="artist">Artists</button><button data-view="release">Music</button><button data-view="event">Events</button><button data-view="gallery">Gallery</button><button data-view="team">Team</button><button id="inboxBtn" type="button">Contact Inbox</button></nav><button id="logout">Log Out</button></aside><div class="workspace"><header><div><small>CONTENT MANAGEMENT</small><h1 id="viewTitle">ARTISTS</h1></div><button id="newItem">+ NEW ITEM</button></header><div id="items" class="items"></div><div id="contactInbox" class="items hidden"></div></div></section></main><dialog id="editor"><form id="editorForm"><button type="button" id="close">×</button><h2 id="editorTitle">CONTENT EDITOR</h2><input id="itemId" type="hidden"><label id="titleLabel">TITLE<input id="title" required></label><div id="artistFields" class="hidden"><label>ARTIST GENRE<input id="genre" placeholder="Hip-Hop, R&B, Pop..."></label><label>ARTIST TYPE<select id="artistRole"><option value="Recording Artist">Recording Artist</option><option value="Producer">Producer</option><option value="Audio Engineer">Audio Engineer</option></select></label></div><div id="releaseFields" class="hidden"><label>ARTIST / CREATOR<input id="releaseArtist"></label><label>RELEASE TYPE<select id="releaseType"><option>Single</option><option>EP</option><option>Album</option><option>Mixtape</option></select></label><label>LISTEN LINK<input id="musicUrl" type="url" placeholder="Spotify, YouTube, SoundCloud..."></label></div><div id="eventFields" class="hidden"><label>VENUE<input id="venue"></label></div><div id="galleryFields" class="hidden"><label>GALLERY CATEGORY<input id="galleryCategory" placeholder="Event, Studio, Behind the Scenes..."></label></div><div id="teamFields" class="hidden"><label>TEAM ROLE<input id="teamRole" placeholder="Owner, Executive, Management..."></label></div><label id="subtitleLabel">SUBTITLE<input id="subtitle"></label><label>UPLOAD IMAGE<input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small class="hint">PNG, JPG, WEBP or GIF. Max 10MB.</small></label><label>IMAGE URL<input id="imageUrl" type="url" placeholder="Or paste an image URL"></label><label id="bodyLabel">DETAILS<textarea id="body"></textarea></label><label>DATE<input id="eventDate" type="datetime-local"></label><label>LOCATION<input id="location"></label><label>STATUS<select id="status"><option value="draft">Draft</option><option value="published">Published</option></select></label><button id="saveBtn" type="submit">SAVE CHANGES</button></form></dialog><script src="../js/admin.js?v=12"></script></body></html>
